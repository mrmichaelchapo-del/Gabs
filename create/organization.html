<!DOCTYPE html>
<html>
<head>
  <title>Create Organization</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #fff;
      padding: 40px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #222;
      padding: 20px;
      border-radius: 10px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #4caf50;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Create a New Organization</h2>

    <label>Organization Name</label>
    <input id="orgName" placeholder="SprunkiLabs">

    <button onclick="createOrganization()">Create Organization</button>

    <p id="result"></p>
  </div>

  <script src="create-organization.js"></script>
</body>
</html>
