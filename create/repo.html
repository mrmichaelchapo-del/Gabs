<!DOCTYPE html>
<html>
<head>
  <title>Create Repo</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #fff;
      padding: 40px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #222;
      padding: 20px;
      border-radius: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #4caf50;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .locked {
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Create a New Repository</h2>

    <!-- OWNER (LOCKED UNTIL LOGIN) -->
    <label>Owner</label>
    <select id="owner" disabled class="locked">
      <option>Login required</option>
    </select>

    <button onclick="login()">Login</button>

    <label>Repository Name</label>
    <input id="repoName" placeholder="my-awesome-repo">

    <label>Visibility</label>
    <select id="visibility">
      <option value="public">Public 🌍</option>
      <option value="private">Private 🔐</option>
    </select>

    <label>README</label>
    <select id="readme">
      <option value="true">Yes 📖</option>
      <option value="false">Disabled 😶</option>
    </select>

    <button onclick="createRepo()">Create Repo</button>

    <p id="result"></p>
  </div>

  <script>
    let currentUser = null;

    async function login() {
      // Call your login backend
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: "Michael", password: "test" })
      });

      const data = await res.json();

      if (data.loggedIn) {
        currentUser = data.username;

        const ownerSelect = document.getElementById("owner");
        ownerSelect.innerHTML = `<option value="${currentUser}">${currentUser}</option>`;
        ownerSelect.disabled = false;
        ownerSelect.classList.remove("locked");
      }

      document.getElementById("result").innerText = JSON.stringify(data, null, 2);
    }

    async function createRepo() {
      if (!currentUser) {
        document.getElementById("result").innerText = "You must log in first.";
        return;
      }

      const owner = document.getElementById("owner").value;
      const name = document.getElementById("repoName").value;
      const visibility = document.getElementById("visibility").value;
      const readme = document.getElementById("readme").value === "true";

      const response = await fetch("/api/repos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          owner,
          name,
          visibility,
          readme
        })
      });

      const data = await response.json();
      document.getElementById("result").innerText = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
